<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VESC Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: rgba(37, 99, 235, 0.1);
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --user-msg-bg: #2563eb;
    --user-msg-text: #ffffff;
    --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --radius: 12px;
    --link-color: #2563eb;
    --chip-bg: rgba(37, 99, 235, 0.08);
  }

  [data-theme="dark"] {
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-light: rgba(59, 130, 246, 0.15);
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-hover: #334155;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --user-msg-bg: #3b82f6;
    --user-msg-text: #ffffff;
    --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
    --link-color: #60a5fa;
    --chip-bg: rgba(59, 130, 246, 0.15);
  }

  * { box-sizing: border-box; transition: background-color 0.2s ease, border-color 0.2s ease; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Header --- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .logo-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--accent), #9333ea);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.4rem;
    box-shadow: 0 2px 5px rgba(37, 99, 235, 0.3);
  }
  .header-titles h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .header-titles p {
    margin: 0;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    font-weight: 500;
    color: #16a34a;
    background: rgba(22, 163, 74, 0.1);
    padding: 2px 7px;
    border-radius: 12px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background: #16a34a;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.9); }
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.45rem 0.75rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .action-btn:hover {
    background: var(--surface-hover);
  }

  /* --- Chat Log & Hero --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .welcome-hero {
    text-align: center;
    padding: 2.5rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .hero-icon {
    font-size: 3rem;
    margin-bottom: 0.25rem;
  }
  .welcome-hero h2 {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .welcome-hero p {
    margin: 0;
    max-width: 520px;
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* --- Messages --- */
  .msg {
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .msg.user {
    align-items: flex-end;
  }
  .msg.agent {
    align-items: flex-start;
  }
  .bubble {
    display: inline-block;
    padding: 0.75rem 1.1rem;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    max-width: 85%;
    line-height: 1.5;
    font-size: 0.95rem;
  }
  .msg.user .bubble {
    background: var(--user-msg-bg);
    color: var(--user-msg-text);
    border: none;
    border-bottom-right-radius: 4px;
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
    box-shadow: none;
  }

  /* --- References and Links --- */
  a.ref-link {
    color: var(--link-color);
    text-decoration: underline;
    text-underline-offset: 2px;
    font-weight: 500;
    transition: opacity 0.15s ease;
    word-break: break-all;
  }
  a.ref-link:hover {
    opacity: 0.8;
  }
  .ref-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: var(--chip-bg);
    color: var(--link-color);
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    text-decoration: none;
    margin-right: 0.4rem;
    margin-top: 0.2rem;
    border: 1px solid rgba(37, 99, 235, 0.2);
  }
  .ref-badge:hover {
    background: var(--accent);
    color: white;
  }

  /* --- Typing Indicator --- */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.2rem;
  }
  .typing-dot {
    width: 8px;
    height: 8px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typing {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* --- A2UI Component Styling --- */
  .a2card {
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 1.25rem;
    background: var(--surface);
    box-shadow: var(--card-shadow);
    width: 100%;
    position: relative;
  }
  .card-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .copy-btn {
    background: var(--surface-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 0.3rem 0.6rem;
    font-size: 0.75rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .copy-btn:hover {
    color: var(--text-primary);
  }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-secondary); background: var(--surface-hover); padding: 0.35rem 0.65rem; border-radius: 6px; }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    cursor: zoom-in;
    border: 1px solid var(--border);
    transition: transform 0.2s ease;
  }
  .a2img:hover {
    transform: scale(1.01);
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }

  /* --- Suggestion Chips --- */
  .chips-container {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1.5rem 0.5rem;
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .chips-container::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .chip:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* --- Input Bar --- */
  .input-panel {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 0.85rem 1.5rem 1.1rem;
  }
  form {
    display: flex;
    gap: 0.6rem;
    max-width: 820px;
    margin: 0 auto;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text-primary);
    resize: none;
    max-height: 160px;
    min-height: 44px;
    line-height: 1.4;
    outline: none;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .send-btn {
    padding: 0.75rem 1.25rem;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    height: 44px;
  }
  .send-btn:hover {
    background: var(--accent-hover);
  }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* --- Lightbox Modal --- */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-icon">⚡</div>
    <div class="header-titles">
      <h1>
        VESC Copilot
        <span class="status-badge"><span class="status-dot"></span> Online</span>
      </h1>
      <p>Hardware Specs • Diagnostics • Build Advisor</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="action-btn" id="newChatBtn" title="Start a fresh conversation session">
      <span class="material-symbols-outlined" style="font-size:1.1rem">restart_alt</span> New Chat
    </button>
    <button class="action-btn" id="themeToggleBtn" title="Toggle dark mode">
      <span class="material-symbols-outlined" style="font-size:1.1rem" id="themeIcon">dark_mode</span>
    </button>
  </div>
</header>

<div id="log">
  <div class="welcome-hero" id="hero">
    <div class="hero-icon">🛹⚡</div>
    <h2>Welcome to VESC Copilot</h2>
    <p>Your expert assistant for DIY PEVs, VESC controller configurations, motor specs, and diagnostics.</p>
  </div>
</div>

<div class="chips-container" id="chips">
  <div class="chip" data-prompt="What are the recommended motor current limits for Little FOCer?">
    <span>⚡ Little FOCer Motor Limits</span>
  </div>
  <div class="chip" data-prompt="What are the differences between Little FOCer and Thor300?">
    <span>⚖️ Little FOCer vs Thor300</span>
  </div>
  <div class="chip" data-prompt="Show me community guides and forum threads on pev.dev about Little FOCer setup">
    <span>🌐 pev.dev Guides</span>
  </div>
  <div class="chip" data-prompt="What Discord communities and YouTube channels can help me tune my VESC?">
    <span>💬 Discord & YouTube Channels</span>
  </div>
</div>

<div class="input-panel">
  <form id="form">
    <textarea id="input" placeholder="Ask about VESC settings, motor currents, or wiring diagrams (Enter to send, Shift+Enter for newline)…" rows="1" autofocus></textarea>
    <button class="send-btn" id="sendBtn" type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:white">send</span>
    </button>
  </form>
</div>

<!-- Image Lightbox Modal -->
<div class="modal-overlay" id="modalOverlay">
  <img class="modal-img" id="modalImg" src="" alt="Enlarged view">
</div>

<script>
const log = document.getElementById("log");
const hero = document.getElementById("hero");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const chips = document.getElementById("chips");
const themeToggleBtn = document.getElementById("themeToggleBtn");
const themeIcon = document.getElementById("themeIcon");
const newChatBtn = document.getElementById("newChatBtn");
const modalOverlay = document.getElementById("modalOverlay");
const modalImg = document.getElementById("modalImg");

// Persistent user/session ID
let currentUserId = localStorage.getItem("vesc_user_id") || "vesc-user-" + Math.random().toString(36).substring(2, 9);
localStorage.setItem("vesc_user_id", currentUserId);

// Dark Mode Theme Handling
function initTheme() {
  const saved = localStorage.getItem("vesc_theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  if (saved === "dark" || (!saved && prefersDark)) {
    document.documentElement.setAttribute("data-theme", "dark");
    themeIcon.textContent = "light_mode";
  } else {
    document.documentElement.removeAttribute("data-theme");
    themeIcon.textContent = "dark_mode";
  }
}
themeToggleBtn.addEventListener("click", () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  if (isDark) {
    document.documentElement.removeAttribute("data-theme");
    localStorage.setItem("vesc_theme", "light");
    themeIcon.textContent = "dark_mode";
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
    localStorage.setItem("vesc_theme", "dark");
    themeIcon.textContent = "light_mode";
  }
});
initTheme();

// New Chat Button
newChatBtn.addEventListener("click", () => {
  currentUserId = "vesc-user-" + Math.random().toString(36).substring(2, 9);
  localStorage.setItem("vesc_user_id", currentUserId);
  log.innerHTML = "";
  if (hero) log.appendChild(hero);
  chips.style.display = "flex";
  input.focus();
});

// Auto-expanding textarea & Enter key support
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event("submit"));
  }
});

// Prompt Chips
chips.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const prompt = chip.getAttribute("data-prompt");
  if (prompt) {
    input.value = prompt;
    form.dispatchEvent(new Event("submit"));
  }
});

// Lightbox modal for images
modalOverlay.addEventListener("click", () => {
  modalOverlay.classList.remove("active");
});
function openModal(src) {
  modalImg.src = src;
  modalOverlay.classList.add("active");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  if (hero && hero.parentNode === log) {
    hero.remove();
  }
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function renderTypingIndicator(b) {
  b.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
}

/* ----------------------------------------------------------------------------
 * Link & Reference Parser: converts Markdown [title](url) or bare URLs into safe clickable links
 * -------------------------------------------------------------------------- */
function renderFormattedText(container, rawText) {
  if (!rawText) return;

  // Regex to match markdown links [title](url) or bare http/https URLs
  const linkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s)]+)/g;
  let lastIndex = 0;
  let match;

  while ((match = linkRegex.exec(rawText)) !== null) {
    // Text before link
    if (match.index > lastIndex) {
      container.appendChild(document.createTextNode(rawText.substring(lastIndex, match.index)));
    }

    if (match[1] && match[2]) {
      // Markdown link [Title](URL)
      const title = match[1];
      const url = match[2];
      const a = el("a", "ref-link", title);
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      container.appendChild(a);
    } else if (match[3]) {
      // Bare URL
      const url = match[3];
      let display = url;
      try {
        const u = new URL(url);
        if (u.hostname.includes("pev.dev")) display = "pev.dev ↗";
        else if (u.hostname.includes("youtube.com") || u.hostname.includes("youtu.be")) display = "YouTube ↗";
        else if (u.hostname.includes("discord.gg") || u.hostname.includes("discord.com")) display = "Discord ↗";
        else display = u.hostname + " ↗";
      } catch (e) {}

      const a = el("a", "ref-link", display);
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = url;
      container.appendChild(a);
    }
    lastIndex = linkRegex.lastIndex;
  }

  if (lastIndex < rawText.length) {
    container.appendChild(document.createTextNode(rawText.substring(lastIndex)));
  }
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      const headerRow = el("div", "card-header-row");
      const titleSpan = el("span", "", "");
      const copyBtn = el("button", "copy-btn");
      copyBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:0.9rem">content_copy</span> Copy';
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(d.innerText.replace(/Copy/g, "").trim());
        copyBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:0.9rem; color:#16a34a">check</span> Copied!';
        setTimeout(() => {
          copyBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:0.9rem">content_copy</span> Copy';
        }, 2000);
      });
      headerRow.appendChild(titleSpan);
      headerRow.appendChild(copyBtn);
      d.appendChild(headerRow);
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      
      const content = boundStr(props.text);
      renderFormattedText(t, content);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Diagram";
      img.addEventListener("click", () => openModal(src));
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) {
      container.appendChild(node);
      drew = true;
    }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textDiv = el("div", null);
    renderFormattedText(textDiv, textStr);
    b.appendChild(textDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const fallbackDiv = el("div", null);
      renderFormattedText(fallbackDiv, flattenText(a2ui) || "(no card content)");
      b.appendChild(fallbackDiv);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  input.style.height = "auto";
  chips.style.display = "none";

  const b = bubble("agent");
  renderTypingIndicator(b);
  sendBtn.disabled = true;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: currentUserId })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
